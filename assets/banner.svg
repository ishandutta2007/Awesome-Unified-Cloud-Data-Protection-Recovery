<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b33" />
      <stop offset="100%" stop-color="#071224" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Animated Pulse -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes orbitFlow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes sweepLight {
        0% { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }
      .cloud-pulse {
        animation: pulseGlow 5s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .stream-line {
        stroke-dasharray: 20, 15;
        animation: orbitFlow 18s linear infinite;
      }
      .badge-float {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .badge-float-alt {
        animation: floatSlow 7s ease-in-out infinite 1.5s;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Background Dynamic Atmospheric Elements (Behind text) -->
  <g class="cloud-pulse">
    <circle cx="200" cy="90" r="130" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
    <circle cx="1020" cy="110" r="140" fill="#818cf8" opacity="0.14" filter="url(#glow)" />
    <circle cx="600" cy="300" r="160" fill="#c084fc" opacity="0.10" filter="url(#glow)" />
  </g>

  <!-- Animated Data Flow Streams -->
  <path d="M 0,100 C 350,170 850,30 1200,100" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.35" class="stream-line" />
  <path d="M 0,270 C 400,200 780,330 1200,250" fill="none" stroke="#818cf8" stroke-width="2.5" opacity="0.3" class="stream-line" style="animation-direction: reverse; animation-duration: 22s;" />

  <!-- Floating Dynamic Tech Pills (Background subtle accents) -->
  <g class="badge-float" opacity="0.75">
    <rect x="70" y="38" width="130" height="30" rx="15" fill="url(#badgeGrad1)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="135" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">☁️ Multi-Cloud</text>
  </g>

  <g class="badge-float-alt" opacity="0.75">
    <rect x="1000" y="42" width="130" height="30" rx="15" fill="url(#badgeGrad1)" stroke="#a855f7" stroke-width="1.2" />
    <text x="1065" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">🛡️ Zero-Trust DR</text>
  </g>

  <g class="badge-float" opacity="0.75">
    <rect x="80" y="295" width="145" height="30" rx="15" fill="url(#badgeGrad1)" stroke="#34d399" stroke-width="1.2" />
    <text x="152" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">⚡ Instant Recovery</text>
  </g>

  <g class="badge-float-alt" opacity="0.75">
    <rect x="980" y="295" width="145" height="30" rx="15" fill="url(#badgeGrad1)" stroke="#f59e0b" stroke-width="1.2" />
    <text x="1052" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">🔒 Air-Gapped Vault</text>
  </g>

  <!-- Foreground Foreground Shield Icon -->
  <g transform="translate(600, 75)" filter="url(#shadow)">
    <!-- Central Shield Background -->
    <path d="M 0,-32 L 28,-20 L 28,10 C 28,26 12,38 0,44 C -12,38 -28,26 -28,10 L -28,-20 Z" fill="#0f172a" stroke="url(#accentGlow)" stroke-width="3" />
    <!-- Inner Checkmark/Cloud -->
    <path d="M -12,4 L -3,13 L 13,-6" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Main Title & Subtitle (Always in foreground, never obscured) -->
  <!-- Top Category Chip -->
  <g filter="url(#shadow)">
    <rect x="440" y="132" width="320" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="600" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5" text-anchor="middle">ENTERPRISE RESILIENCE &amp; BAAS DIRECTORY</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#f8fafc" text-anchor="middle" filter="url(#shadow)">
    Awesome Unified Cloud Data Protection &amp; Recovery
  </text>

  <!-- Subtitle -->
  <text x="600" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Curated Hub of Commercial SaaS Platforms &amp; Top Open-Source Backup Engines
  </text>

  <!-- Bottom Core Feature Matrix Pills -->
  <g transform="translate(330, 255)">
    <rect x="0" y="0" width="125" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="62" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Hybrid &amp; Multi-Cloud</text>

    <rect x="140" y="0" width="125" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="202" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Ransomware Vaults</text>

    <rect x="280" y="0" width="125" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="342" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Transparent Pricing</text>

    <rect x="420" y="0" width="125" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="482" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">GitHub Star Ranked</text>
  </g>
</svg>
